# ---------------------------------------------------------------------------
# MCP - nginx front-end
#
# nginx terminates TLS for the MCP hostnames and forwards every request to the
# Traefik container over the shared docker bridge network ("mcp"). The original
# Host header is preserved, so Traefik routes on the real hostname.
# Traefik is NOT published on a host port; only reachable from the mcp network.
#
# Hostnames:
#   mcp.data.bs.ch                  (ogd)
#   mcp.statistik.bs.ch             (statistik)
#   mcp-grosserrat.statistik.bs.ch  (grossrat)
#
# NOTE: nginx must be joined to the "mcp" docker network with network alias
# "reverse-proxy" (i.e. nginx runs as a container on the same compose project).
# ---------------------------------------------------------------------------

# --- HTTP -> HTTPS redirect (captures the full requested host) ---
server {
    listen 80;
    listen [::]:80;
    server_name mcp.data.bs.ch mcp.statistik.bs.ch mcp-grosserrat.statistik.bs.ch;
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# --- HTTPS: ogd (data.bs.ch) ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mcp.data.bs.ch;

    ssl_certificate     /etc/nginx/ssl/mcp.data.bs.ch/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/mcp.data.bs.ch/privkey.pem;

    location / {
        proxy_pass http://reverse-proxy/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

# --- HTTPS: statistik + grosserrat (statistik.bs.ch) ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mcp.statistik.bs.ch mcp-grosserrat.statistik.bs.ch;

    # Cert covering mcp.statistik.bs.ch and mcp-grosserrat.statistik.bs.ch
    # (multi-SAN or wildcard *.statistik.bs.ch).
    ssl_certificate     /etc/nginx/ssl/statistik.bs.ch/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/statistik.bs.ch/privkey.pem;
    ssl_server_name on;

    location / {
        proxy_pass http://reverse-proxy/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
