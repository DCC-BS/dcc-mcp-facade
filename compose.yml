networks:
  mcp:
    driver: bridge

services:
  reverse-proxy:
    image: traefik:v3.6.1
    container_name: mcp-reverse-proxy
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - "--providers.docker.endpoint=unix:///var/run/docker.sock"
      - --entrypoints.http.address=:80
    ports:
    - "${TRAEFIK_PORT:-8001}:80"
    networks:
      - mcp
    # Docker provider must reach the daemon. The socket path comes from .env
    # (see .env.example) — it differs between rootless and rootful docker.
    volumes:
      - "${DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock:ro"

  ogd:
    image: ghcr.io/dcc-bs/mcp-data-bs:latest
    container_name: mcp-ogd
    restart: unless-stopped
    environment:
      DATA_PORTAL_DOMAIN: data.bs.ch
      PORT: "8000"
      # nginx forwards the bare Host header (no :port), so use an exact match.
      # A "*:port" wildcard only matches a Host WITH a port and would 421 here.
      MCP_ALLOWED_HOSTS: "mcp.data.bs.ch"
    networks:
      - mcp
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=5)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ogd.rule=Host(`mcp.data.bs.ch`)"
      - "traefik.http.routers.ogd.entrypoints=http"
      - "traefik.http.services.ogd.loadbalancer.server.port=8000"

  grossrat:
    # The Grosser Rat Basel-Stadt corpus: every business item, document and transcript since 1973.
    # The databases are inside the image (~10 GB unpacked); it needs no volume and no model server.
    image: ghcr.io/dcc-bs/grossrat-bs-mcp:latest
    container_name: mcp-grossrat
    restart: unless-stopped
    environment:
      PORT: "8000"
      # nginx forwards the bare Host header (no :port), so use an exact match.
      MCP_ALLOWED_HOSTS: "mcp-grosserrat.statistik.bs.ch"
    networks:
      - mcp
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=5)"]
      interval: 30s
      timeout: 5s
      retries: 3
      # Opening the index and loading the search model takes longer than a proxy's start.
      start_period: 60s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grossrat.rule=Host(`mcp-grosserrat.statistik.bs.ch`)"
      - "traefik.http.routers.grossrat.entrypoints=http"
      - "traefik.http.services.grossrat.loadbalancer.server.port=8000"

  statistik:
    # Indicators of the Statistisches Amt Basel-Stadt (statistik.bs.ch): search,
    # metadata and time series. Stateless; reads the public portal API.
    image: ghcr.io/dcc-bs/mcp-statistikportal:latest
    container_name: mcp-statistik
    restart: unless-stopped
    environment:
      STATISTIK_PORTAL_DOMAIN: statistik.bs.ch
      PORT: "8000"
      # nginx forwards the bare Host header (no :port), so use an exact match.
      MCP_ALLOWED_HOSTS: "mcp.statistik.bs.ch"
    networks:
      - mcp
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=5)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.statistik.rule=Host(`mcp.statistik.bs.ch`)"
      - "traefik.http.routers.statistik.entrypoints=http"
      - "traefik.http.services.statistik.loadbalancer.server.port=8000"
